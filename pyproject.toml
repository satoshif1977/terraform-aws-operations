# Python ツールの設定
#
# ★ ruff は設定ファイルが無いと「その時点の既定ルールセット」で動く。
#   本体のバージョンが上がるだけで有効なルールが増えるため、コードを 1 行も
#   変えていないのに CI が落ちる（実際 0.15 → 0.16 で G010 などが増えた）。
#   select を明示して、どのルールで見るかをこちら側で決める。
#
#   値は共有ユーティリティ（retry.py / logger.py / metrics.py）の基準実装がある
#   aws-bedrock-agent と揃えてある。移植のたびに lint の差分で揺れないようにするため。
#
#   E501（行長）は black に任せるので無効化する。両方で見ると折り返し方の
#   好みが競合して、直しようのない指摘が残る。

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
