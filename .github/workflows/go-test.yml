name: Go Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  go-test:
    name: Go ユニットテスト
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: lambda_go/go.sum

      - name: go vet
        run: go vet ./...
        working-directory: lambda_go

      - name: go test guardduty-notifier（10件）
        run: go test ./guardduty-notifier/... -v -race
        working-directory: lambda_go
