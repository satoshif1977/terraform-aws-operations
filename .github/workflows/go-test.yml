name: Go Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  go-test:
    name: Go ユニットテスト
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.21'
          cache-dependency-path: lambda_go/go.sum

      - name: go vet
        run: go vet ./...
        working-directory: lambda_go

      - name: go test guardduty-notifier（22件）
        run: go test ./guardduty-notifier/... -v -race -coverprofile=coverage.out -covermode=atomic
        working-directory: lambda_go
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lambda_go/coverage.out
          flags: go
          fail_ci_if_error: false
